name: Code Lint

on:
  pull_request:
    paths:
      - "**/*.ipynb"
      - "**/*.py"
      - "**/requirements.txt"
      - "pyproject.toml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Ruff
        uses: astral-sh/ruff-action@v3
        with:
          args: check --output-format=github
